spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/education_local
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

server:
  address: 0.0.0.0
  port: 8080


datasource:
  seed:
    enabled: false
